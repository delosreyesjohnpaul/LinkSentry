services:
  proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      PREVIEW_SERVICE_TOKEN: ${PREVIEW_SERVICE_TOKEN:?Set PREVIEW_SERVICE_TOKEN in .preview.env}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - browser_only
      - proxy_egress

  renderer:
    build: ./renderer
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      PREVIEW_SERVICE_TOKEN: ${PREVIEW_SERVICE_TOKEN:?Set PREVIEW_SERVICE_TOKEN in .preview.env}
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/pwuser/.cache:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    networks:
      - browser_only

networks:
  browser_only:
    internal: true
  proxy_egress:
    driver: bridge
